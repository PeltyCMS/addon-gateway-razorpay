[package]
name = "pelty-addon-gateway-razorpay"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Export the addon ABI (off when another addon reuses this crate).
default = ["export"]
export = []

[dependencies]
pelty-addon-sdk = { workspace = true, features = ["gateway"] }
pelty-payments = { path = "../../../crates/pelty-payments" }
pelty-core = { path = "../../../crates/pelty-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde-str"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
base64 = "0.22"
rsa = { version = "0.9", default-features = false, features = ["std", "sha2", "pem"] }
crc32fast = "1.5"

[dev-dependencies]
pelty-payments = { path = "../../../crates/pelty-payments", features = ["test-util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
axum = { version = "0.8", features = ["macros"] }
